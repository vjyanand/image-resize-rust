[package]
name = "image"
version = "0.1.6"
edition = "2024"

[dependencies]
image = { version = "0.25.10" }
reqwest = { version = "0.13.5", features = [
  "brotli",
  "gzip",
  "http2",
  "zstd",
  "deflate",
] }
serde = { version = "1.0.229", features = ["derive"] }
bytes = "1.11.1"
url = "2.5.8"
axum = { version = "0.8.8", default-features = false, features = [
  "query",
  "tokio",
  "macros",
  "http2",
  "json",
] }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
  "fmt",
  "env-filter",
] }

[dependencies.lambda_http]
version = "1.3.1"
optional = true

[features]
lambda = ["lambda_http"]

[[bin]]
name = "image"
path = "src/main.rs"

[[bin]]
name = "lambda"
path = "src/lambda.rs"
required-features = ["lambda"]

[profile.release]
strip = true
panic = "abort"
